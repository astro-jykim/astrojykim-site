# Facilities shown at the end of the Research page (<!-- projects --> marker).
# image:  first file that exists is used (photos are downloaded by ops/get-images.sh).
# credit: shown on the card — required by the image licences.
# role:   how we use it — edit freely.

- id: eht
  name: Event Horizon Telescope (EHT)
  url: https://eventhorizontelescope.org/
  image: [facilities/eht-m87.jpg, highlights/eht2019.jpg]
  credit: "Image: EHT Collaboration"
  text: >-
    A global array of millimeter radio telescopes working as one Earth-sized telescope. It produced
    the first images of the black holes in M87 (2019) and at the centre of the Milky Way (2022).
  role: >-
    Jae-Young Kim is a member of the EHT Collaboration (Science Board 2024–2026). We work on M87,
    Sgr A* and AGN jets such as 3C 279 and 3C 84.

- id: gmva
  name: Global Millimeter VLBI Array (GMVA)
  url: https://www3.mpifr-bonn.mpg.de/div/vlbi/globalmm/
  image: [research/effelsberg.jpg]
  credit: "Effelsberg 100-m telescope. Photo: Dr. Schorsch"
  text: >-
    VLBI at 3 mm (86 GHz) with telescopes in Europe, the US, Korea and ALMA, bridging the EHT's
    horizon-scale view and the larger jet.
  role: >-
    We use GMVA data to image the jet base of M87 and of blazars and radio galaxies.

- id: kvn
  name: Korean VLBI Network (KVN)
  url: https://radio.kasi.re.kr/kvn/main_kvn.php
  image: [facilities/kvn.jpg]
  credit: "Photo: KASI"
  text: >-
    Four 21-m radio telescopes of KASI in Seoul, Ulsan, Jeju and Pyeongchang, observing at 22, 43,
    86 and 129 GHz simultaneously.
  role: >-
    We use KVN for multi-frequency observations of jets.

- id: ska
  name: SKA and its pathfinders
  url: https://www.skao.int/
  image: [facilities/ska-mid.jpg]
  credit: "SKA-Mid (artist's impression with MeerKAT). Credit: SKAO"
  text: >-
    The Square Kilometre Array, under construction in South Africa and Australia, and its
    pathfinders and precursors LOFAR, ASKAP, MWA and MeerKAT.
  role: >-
    We use public wide-field surveys to find unusual, faint and distant black holes.
