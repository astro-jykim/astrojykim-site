# Facilities shown at the end of the Research page (<!-- projects --> marker).
# image:  first file that exists is used (photos are downloaded by ops/get-images.sh).
# credit: shown under the text — required by the image licences.
# role:   what OUR GROUP does with it — edit freely.

- id: eht
  name: Event Horizon Telescope (EHT)
  url: https://eventhorizontelescope.org/
  image: [facilities/eht-m87.jpg, highlights/eht2019.jpg]
  credit: "Image: EHT Collaboration"
  text: >-
    A global array of millimeter radio telescopes — including ALMA in Chile — working as one
    Earth-sized telescope. It produced the first images of the black holes in M87 (2019) and at the
    centre of the Milky Way (2022).
  role: >-
    Member of the EHT Collaboration (Science Board 2024–2026; AGN working group co-coordinator
    2022–2024): M87, Sgr A* and AGN jets such as 3C 279 and 3C 84, and the next-generation EHT.

- id: gmva
  name: Global Millimeter VLBI Array (GMVA)
  url: https://www3.mpifr-bonn.mpg.de/div/vlbi/globalmm/
  image: [research/effelsberg.jpg]
  credit: "Effelsberg 100-m telescope. Photo: Dr. Schorsch"
  text: >-
    VLBI at 3 mm (86 GHz) with telescopes in Europe, the US, Korea and ALMA, connecting the EHT's
    horizon-scale view to the larger jet.
  role: >-
    Imaging of the jet-launching region of M87 and of blazar and radio-galaxy jets.

- id: kvn
  name: Korean VLBI Network (KVN)
  url: https://radio.kasi.re.kr/kvn/main_kvn.php
  image: [facilities/kvn.jpg]
  credit: "Photo: KASI"
  text: >-
    21-m radio telescopes of the Korea Astronomy and Space Science Institute in Seoul, Ulsan, Jeju and
    Pyeongchang, observing at 22, 43, 86 and 129 GHz simultaneously.
  role: >-
    Multi-frequency studies of jets, and the path toward expanded Korean millimeter-VLBI facilities.

- id: space-vlbi
  name: Space millimeter VLBI
  url: https://www.blackholeexplorer.org/
  image: [facilities/bh-simulation.jpg]
  credit: "Simulation: Jordy Davelaar et al. / Radboud University / BlackHoleCam"
  text: >-
    A millimeter antenna in orbit, linked to ground telescopes, would make baselines longer than
    Earth and resolve the thin photon ring around a black hole. Concepts such as the Black Hole
    Explorer (BHEX) aim for the 2030s.
  role: >-
    Telescope optics, instrumentation and imaging simulations for ground and space millimeter VLBI.

- id: ska
  name: Square Kilometre Array (SKA)
  url: https://www.skao.int/
  image: [facilities/ska-mid.jpg]
  credit: "SKA-Mid (artist's impression with MeerKAT). Credit: SKAO"
  text: >-
    The world's largest radio telescope, under construction in South Africa and Australia. Its
    pathfinders and precursors — LOFAR, ASKAP, MWA and MeerKAT — already survey the whole sky.
  role: >-
    Searches for faint, small and distant black holes in wide-field surveys, and machine learning
    for SKA-scale data.

- id: icecube
  name: IceCube Neutrino Observatory
  url: https://icecube.wisc.edu/
  image: [facilities/icecube.jpg, highlights/kim2025.png]
  credit: "Photo: Yuya Makino, IceCube/NSF"
  text: >-
    A cubic-kilometre neutrino detector in the ice at the South Pole, sending real-time alerts when
    a high-energy neutrino arrives from space.
  role: >-
    Radio and VLBI follow-up of neutrino alerts to identify which black holes produce them, e.g. the
    blazar PKS 0735+178.
