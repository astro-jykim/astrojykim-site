# Site-wide settings. Edit freely.

title: UNIST Observational Astrophysics Group
domain: www.astrojykim.com
# Thin notice under the menu on every page (empty = no notice). Example: "**Under construction** — some pages are still being updated."
construction: ""

copyright: © Jae-Young Kim. All rights reserved.

# Short description shown by search engines and in link previews (Slack, KakaoTalk, X ...).
description: "Jae-Young Kim's research group at UNIST, Korea: black holes and relativistic jets studied with radio interferometry — the Event Horizon Telescope, VLBI, multi-messenger astrophysics and the SKA."

# Visitor statistics. Paste the Google Analytics 4 "Measurement ID" (looks like G-XXXXXXXXXX)
# between the quotes; leave it empty to switch analytics off.
analytics:
  ga4: ""

# Header logo (put the file in assets/img/site/). If the file is missing, a drawn mark is used.
logo: site/logo.png

# Top navigation, in order.
nav:
  - {title: Home, url: /}
  - {title: Research, url: /research/}
  - {title: Highlights, url: /highlights/}
  - {title: Publications, url: /publications/}
  - {title: Members, url: /members/}
  - {title: Jae-Young Kim, url: /jae-young-kim/}
  - {title: Join Us, url: /join-us/}
  - {title: 2027 Positions, url: /positions-2027/}
  - {title: For Students, url: /before-you-apply/}
  - {title: Resources, url: /resources/}
  - {title: Contact, url: /contact/}

# Banner images per page (files in assets/img/banners/). Missing files fall back to a plain band.
banners:
  highlights: banners/highlights.jpg
  members: [banners/members-meerkat.jpg]

# How many highlights to show on the home page.
home_highlights: 6

# Old Google Sites addresses that should keep working.
redirects:
  /home/: /

# Banner height per page: small | medium | large  (pages can also set banner_size in their front matter)
banner_sizes: {}
banner_positions: {members: center 38%}

# Credit line shown in the corner of a banner (required for ESO / NASA / NRAO pictures)
banner_credits:
  # A short description and the credit, shown in the corner of each banner (required by the image licences).
  banners/home.jpg: "ALMA under the Magellanic Clouds, two small galaxies orbiting our Milky Way. Photo: ESO/C. Malin"
  research/m87-polarized.jpg: "The black hole in M87 in polarised light; the lines trace the magnetic field near the event horizon. Image: EHT Collaboration"
  banners/research.jpg: "The black hole in M87 in polarised light. Image: EHT Collaboration"
  banners/highlights.jpg: "The whole sky in gamma rays, seen by Fermi: the bright band is our Galaxy, and many of the dots are distant blazars. Credit: NASA/DOE/Fermi LAT Collaboration"
  banners/vla-night.jpg: "The Very Large Array at night, New Mexico: 27 antennas working as one telescope up to 36 km across. Photo: NRAO/AUI/NSF"
  banners/vla.jpg: "The Karl G. Jansky Very Large Array, New Mexico. Photo: NRAO/AUI/NSF"
  banners/students-webb.jpg: "Webb's first deep field: thousands of galaxies in a patch of sky the size of a grain of sand held at arm's length. Credit: NASA, ESA, CSA and STScI"
  banners/resources-correlator.jpg: "The ALMA correlator, the supercomputer that combines the signals of the ALMA antennas into images, 5,000 m up in the Andes. Photo: ESO"
  banners/members-meerkat.jpg: "MeerKAT in the Karoo, South Africa: 64 dishes that will become part of SKA-Mid. Photo: South African Radio Astronomy Observatory (SARAO)"
  banners/join-us-alma.jpg: "The Milky Way over ALMA on the Chajnantor plateau, 5,000 m up in the Chilean Andes. Photo: P. Horálek/ESO"
  banners/join-us-kvn.jpg: "KVN Ulsan, ten minutes by car from UNIST. Photo: KASI"
  banners/m87-jet-art.jpg: "The jet of M87 and the ring around its black hole (artist's impression), first seen together in 2023. Credit: S. Dagnello (NRAO/AUI/NSF)"
  banners/2-3m-radio-telescope.jpg: "The 2.3 m radio telescope at Kyungpook National University (2023)."

# Publications page: journals moved to the end of "Where we publish" (e.g. MDPI journals).
journals_last: [Galaxies, Universe]
