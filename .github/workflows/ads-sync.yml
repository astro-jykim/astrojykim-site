name: ADS sync

# 1st of every month, 09:00 KST — or run it by hand from the Actions tab.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch from NASA ADS
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python scripts/sync_ads.py --write
      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/ads-sync
          delete-branch: true
          commit-message: "Publications update from NASA ADS"
          title: "New papers from ADS"
          body: |
            Automatic monthly update from NASA ADS.

            - `data/publications.yml` — full list, citation counts refreshed
            - `data/highlights.yml` — new papers (if any) were added at the top

            Before merging: check the new highlight entries (title, links), delete any you
            don't want, and add an image named `<id>.jpg` to `assets/img/highlights/`.
            Merging publishes the site automatically.
