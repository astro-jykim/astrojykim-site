name: ADS sync

# Every Monday 09:30 KST — or run it by hand from the Actions tab.
# Opens a pull request only when a NEW highlight paper appears
# (the publication list itself is refreshed by every build, see deploy.yml).
on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch from NASA ADS
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python scripts/sync_ads.py --write --only highlights
      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/ads-sync
          delete-branch: true
          commit-message: "New highlight papers from NASA ADS"
          title: "New papers from ADS"
          body: |
            Automatic weekly check of NASA ADS: new papers were added at the top of
            `data/highlights.yml`.

            Before merging: check the new highlight entries (title, links), delete any you
            don't want, and add an image named `<id>.jpg` to `assets/img/highlights/`.
            Merging publishes the site automatically.
