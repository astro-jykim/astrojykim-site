name: Build and deploy

# Every push to main rebuilds the site and publishes it on GitHub Pages.
# Every Monday 09:00 KST it also rebuilds, so the publication list and citation
# numbers stay current (they are fetched from NASA ADS at build time, nothing is committed).
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh the publication list from NASA ADS
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python scripts/sync_ads.py --write --only pubs || echo "::warning::ADS not reachable, using the list in the repository"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          SITE_BASEURL: ${{ steps.pages.outputs.base_path }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
