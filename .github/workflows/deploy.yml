name: Build and deploy

# Every push to main rebuilds the site and publishes it on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          SITE_BASEURL: ${{ steps.pages.outputs.base_path }}
        run: python build.py
      - name: Check nothing from the original site went missing
        run: python scripts/check_completeness.py || echo "::warning::Some original text is not on the site (see log)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
